<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">STFU target UI screen mockup</title>
  <desc id="desc">Wireframe for an Avalonia NPR viewport with a right inspector panel and bottom status strip.</desc>
  <defs>
    <style>
      .bg { fill: #f4f4f1; }
      .surface { fill: #ffffff; stroke: #d2d2cc; stroke-width: 1; }
      .panel { fill: #f9f9f6; stroke: #c9c9c1; stroke-width: 1; }
      .viewport { fill: #efefea; stroke: #b8b8af; stroke-width: 1; }
      .grid-minor { stroke: #deded8; stroke-width: 1; }
      .grid-major { stroke: #c9c9c1; stroke-width: 1; }
      .ink { stroke: #1f1f1d; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ink-light { stroke: #66665f; stroke-width: 1.2; fill: none; stroke-linecap: round; opacity: .65; }
      .text { fill: #242421; font-family: Segoe UI, Arial, sans-serif; font-size: 14px; }
      .muted { fill: #66665f; font-family: Segoe UI, Arial, sans-serif; font-size: 12px; }
      .heading { fill: #161614; font-family: Segoe UI, Arial, sans-serif; font-weight: 600; font-size: 15px; }
      .title { fill: #161614; font-family: Segoe UI, Arial, sans-serif; font-weight: 700; font-size: 18px; }
      .small { fill: #242421; font-family: Segoe UI, Arial, sans-serif; font-size: 11px; }
      .button { fill: #ffffff; stroke: #bebeb6; stroke-width: 1; }
      .button-active { fill: #1f1f1d; stroke: #1f1f1d; stroke-width: 1; }
      .button-active-text { fill: #ffffff; font-family: Segoe UI, Arial, sans-serif; font-size: 12px; font-weight: 600; }
      .slider-track { stroke: #c7c7be; stroke-width: 4; stroke-linecap: round; }
      .slider-fill { stroke: #1f1f1d; stroke-width: 4; stroke-linecap: round; }
      .thumb { fill: #ffffff; stroke: #1f1f1d; stroke-width: 2; }
      .divider { stroke: #d8d8d0; stroke-width: 1; }
      .badge { fill: #eeeeea; stroke: #c9c9c1; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="900"/>

  <rect class="surface" x="0" y="0" width="1440" height="48"/>
  <text class="title" x="20" y="30">STFU</text>
  <text class="muted" x="75" y="30">Scene-To-Flat Unrenderer</text>

  <rect class="button-active" x="252" y="12" width="64" height="24" rx="4"/>
  <text class="button-active-text" x="274" y="29">NPR</text>
  <rect class="button" x="322" y="12" width="64" height="24" rx="4"/>
  <text class="small" x="344" y="29">Mesh</text>
  <rect class="button" x="396" y="12" width="92" height="24" rx="4"/>
  <text class="small" x="417" y="29">Reset Cam</text>
  <rect class="button" x="496" y="12" width="84" height="24" rx="4"/>
  <text class="small" x="519" y="29">Export</text>

  <text class="muted" x="1180" y="30">generic-sketch</text>
  <rect class="badge" x="1288" y="12" width="132" height="24" rx="4"/>
  <text class="small" x="1304" y="29">AOT viewport</text>

  <rect class="viewport" x="16" y="64" width="1048" height="780"/>
  <g>
    <path class="grid-minor" d="M40 64V844 M64 64V844 M88 64V844 M112 64V844 M136 64V844 M160 64V844 M184 64V844 M208 64V844 M232 64V844 M256 64V844 M280 64V844 M304 64V844 M328 64V844 M352 64V844 M376 64V844 M400 64V844 M424 64V844 M448 64V844 M472 64V844 M496 64V844 M520 64V844 M544 64V844 M568 64V844 M592 64V844 M616 64V844 M640 64V844 M664 64V844 M688 64V844 M712 64V844 M736 64V844 M760 64V844 M784 64V844 M808 64V844 M832 64V844 M856 64V844 M880 64V844 M904 64V844 M928 64V844 M952 64V844 M976 64V844 M1000 64V844 M1024 64V844 M1048 64V844"/>
    <path class="grid-minor" d="M16 88H1064 M16 112H1064 M16 136H1064 M16 160H1064 M16 184H1064 M16 208H1064 M16 232H1064 M16 256H1064 M16 280H1064 M16 304H1064 M16 328H1064 M16 352H1064 M16 376H1064 M16 400H1064 M16 424H1064 M16 448H1064 M16 472H1064 M16 496H1064 M16 520H1064 M16 544H1064 M16 568H1064 M16 592H1064 M16 616H1064 M16 640H1064 M16 664H1064 M16 688H1064 M16 712H1064 M16 736H1064 M16 760H1064 M16 784H1064 M16 808H1064 M16 832H1064"/>
    <path class="grid-major" d="M112 64V844 M208 64V844 M304 64V844 M400 64V844 M496 64V844 M592 64V844 M688 64V844 M784 64V844 M880 64V844 M976 64V844"/>
    <path class="grid-major" d="M16 160H1064 M16 256H1064 M16 352H1064 M16 448H1064 M16 544H1064 M16 640H1064 M16 736H1064 M16 832H1064"/>
  </g>

  <g transform="translate(390 190)">
    <path class="ink" d="M198 94 C154 92 126 118 122 160 C112 228 144 302 206 326 C270 350 360 330 392 274 C434 202 408 126 350 104 C304 86 250 86 198 94Z"/>
    <path class="ink" d="M174 168 C132 156 91 174 76 214 C60 256 88 286 132 282"/>
    <path class="ink" d="M374 166 C420 154 462 175 476 216 C490 258 462 288 418 284"/>
    <path class="ink" d="M196 182 C224 166 252 164 280 178"/>
    <path class="ink" d="M304 178 C334 163 366 168 388 190"/>
    <path class="ink" d="M226 222 C254 232 292 234 324 222"/>
    <path class="ink" d="M248 272 C278 286 322 284 350 264"/>
    <path class="ink-light" d="M180 132 C204 144 232 150 262 146"/>
    <path class="ink-light" d="M304 146 C338 146 366 138 392 126"/>
    <path class="ink-light" d="M154 234 C190 250 228 258 272 258"/>
    <path class="ink-light" d="M308 256 C354 248 386 232 414 204"/>
    <path class="ink-light" d="M162 298 L224 274 M188 318 L254 288 M226 334 L290 300 M330 304 L390 282 M354 286 L414 260"/>
  </g>

  <rect class="panel" x="1080" y="64" width="344" height="780"/>
  <text class="heading" x="1100" y="94">Inspector</text>
  <text class="muted" x="1100" y="114">Live NPR controls</text>
  <line class="divider" x1="1100" y1="130" x2="1404" y2="130"/>

  <text class="heading" x="1100" y="158">Preset</text>
  <rect class="button" x="1100" y="174" width="304" height="34" rx="4"/>
  <text class="text" x="1114" y="196">generic-sketch</text>
  <text class="muted" x="1310" y="196">editable</text>

