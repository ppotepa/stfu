  <line class="slider-fill" x1="1200" y1="266" x2="1288" y2="266"/>
  <circle class="thumb" cx="1288" cy="266" r="6"/>
  <text class="small" x="1386" y="270">34</text>

  <text class="muted" x="1100" y="306">Hidden bias</text>
  <line class="slider-track" x1="1200" y1="302" x2="1378" y2="302"/>
  <line class="slider-fill" x1="1200" y1="302" x2="1248" y2="302"/>
  <circle class="thumb" cx="1248" cy="302" r="6"/>

  <text class="heading" x="1100" y="350">Hatching</text>
  <text class="muted" x="1100" y="378">Density</text>
  <line class="slider-track" x1="1200" y1="374" x2="1378" y2="374"/>
  <line class="slider-fill" x1="1200" y1="374" x2="1284" y2="374"/>
  <circle class="thumb" cx="1284" cy="374" r="6"/>
  <text class="muted" x="1100" y="414">Shade threshold</text>
  <line class="slider-track" x1="1200" y1="410" x2="1378" y2="410"/>
  <line class="slider-fill" x1="1200" y1="410" x2="1300" y2="410"/>
  <circle class="thumb" cx="1300" cy="410" r="6"/>

  <text class="heading" x="1100" y="458">Stroke Style</text>
  <text class="muted" x="1100" y="486">Thickness</text>
