  <line class="slider-fill" x1="1200" y1="482" x2="1264" y2="482"/>
  <circle class="thumb" cx="1264" cy="482" r="6"/>
  <text class="muted" x="1100" y="522">Jitter</text>
  <line class="slider-track" x1="1200" y1="518" x2="1378" y2="518"/>
  <line class="slider-fill" x1="1200" y1="518" x2="1280" y2="518"/>
  <circle class="thumb" cx="1280" cy="518" r="6"/>
  <text class="muted" x="1100" y="558">Overshoot</text>
  <line class="slider-track" x1="1200" y1="554" x2="1378" y2="554"/>
  <line class="slider-fill" x1="1200" y1="554" x2="1272" y2="554"/>
  <circle class="thumb" cx="1272" cy="554" r="6"/>

  <text class="heading" x="1100" y="608">Debug Counters</text>
  <rect class="badge" x="1100" y="626" width="140" height="30" rx="4"/>
