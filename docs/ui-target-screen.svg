  <rect class="badge" x="1100" y="706" width="140" height="30" rx="4"/>
  <text class="small" x="1112" y="726">samples 311</text>
  <rect class="badge" x="1252" y="706" width="152" height="30" rx="4"/>
  <text class="small" x="1264" y="726">topology 1452</text>

  <line class="divider" x1="1100" y1="760" x2="1404" y2="760"/>
  <rect class="button" x="1100" y="780" width="92" height="34" rx="4"/>
  <text class="small" x="1120" y="801">Reset</text>
  <rect class="button-active" x="1204" y="780" width="92" height="34" rx="4"/>
  <text class="button-active-text" x="1227" y="801">Apply</text>
  <rect class="button" x="1308" y="780" width="96" height="34" rx="4"/>
  <text class="small" x="1334" y="801">Save</text>

  <rect class="surface" x="0" y="852" width="1440" height="48"/>
  <text class="muted" x="20" y="881">Viewport 1280x720</text>
  <text class="muted" x="178" y="881">Camera FOV 60</text>
  <text class="muted" x="314" y="881">Mode NPR</text>
  <text class="muted" x="424" y="881">Preset generic-sketch</text>
  <text class="muted" x="1220" y="881">LMB orbit | Ctrl+LMB pan | wheel FOV</text>
